<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeschool Weekly Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="var(--accent)"/>
          <path d="M7 10h14M7 14h10M7 18h12" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="app-title">Weekly Tracker</h1>
        <p class="app-subtitle" id="week-label">Loading…</p>
      </div>
    </div>
    <div class="header-right">
      <a href="archive.html" class="btn btn-ghost">📋 Archive</a>
      <button class="btn btn-ghost" id="btn-manage">⚙ Manage Students</button>
      <button class="btn btn-primary" id="btn-close-week">Close Week</button>
    </div>
  </header>

  <!-- WEEK GRID -->
  <main class="week-grid-wrapper">
    <div class="week-grid" id="week-grid">
      <!-- Columns built by JS -->
    </div>
  </main>

</div>

<!-- MODAL: Manage Students -->
<div class="modal-backdrop hidden" id="modal-students">
  <div class="modal">
    <div class="modal-header">
      <h2>Manage Students</h2>
      <button class="modal-close" data-close="modal-students">✕</button>
    </div>
    <div class="modal-body" id="student-list-editor">
      <!-- built by JS -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btn-add-student">+ Add Student</button>
    </div>
  </div>
</div>

<!-- MODAL: Edit Student Courses -->
<div class="modal-backdrop hidden" id="modal-courses">
  <div class="modal">
    <div class="modal-header">
      <h2 id="courses-modal-title">Edit Courses</h2>
      <button class="modal-close" data-close="modal-courses">✕</button>
    </div>
    <div class="modal-body" id="course-list-editor">
      <!-- built by JS -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btn-add-course">+ Add Course</button>
    </div>
  </div>
</div>

    <div class="modal-body" id="archive-list">
      <!-- built by JS -->
    </div>
  </div>
</div>

    <div class="modal-body" id="archive-detail-body"></div>
  </div>
</div>

<!-- MODAL: Add Day-Specific Course -->
<div class="modal-backdrop hidden" id="modal-day-course">
  <div class="modal">
    <div class="modal-header">
      <h2>Add Course for <span id="day-course-student-name"></span></h2>
      <button class="modal-close" data-close="modal-day-course">✕</button>
    </div>
    <div class="modal-body">
      <p class="field-label">Course name</p>
      <input class="input-inline" id="day-course-input" placeholder="e.g. Art, Lab, Music…" style="width:100%;margin-bottom:18px">
      <p class="field-label">Apply to days</p>
      <div class="day-picker">
        <label class="day-pill" for="dc-day-0"><input type="checkbox" id="dc-day-0"><span>Mon</span></label>
        <label class="day-pill" for="dc-day-1"><input type="checkbox" id="dc-day-1"><span>Tue</span></label>
        <label class="day-pill" for="dc-day-2"><input type="checkbox" id="dc-day-2"><span>Wed</span></label>
        <label class="day-pill" for="dc-day-3"><input type="checkbox" id="dc-day-3"><span>Thu</span></label>
        <label class="day-pill" for="dc-day-4"><input type="checkbox" id="dc-day-4"><span>Fri</span></label>
      </div>
      <div class="day-picker-shortcuts">
        <button class="btn btn-ghost btn-sm" id="dc-just-this">Just this day</button>
        <button class="btn btn-ghost btn-sm" id="dc-all">All week</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="btn-save-day-course">Add Course</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
