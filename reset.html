<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset — Dev Utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #f5f4f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    padding: 40px 48px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .icon { font-size: 2.8rem; margin-bottom: 16px; }
  .title {
    font-size: 1.3rem;
    font-weight: 800;
    color: #2c2a26;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 0.88rem;
    color: #7a7570;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .keys-list {
    background: #f9f8f5;
    border: 1.5px solid #e8e6e0;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 28px;
    text-align: left;
  }
  .keys-list p {
    font-size: 0.75rem;
    color: #b0ada8;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .key-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 0.82rem;
    color: #2c2a26;
    border-bottom: 1px solid #f0ede8;
  }
  .key-row:last-child { border-bottom: none; }
  .key-name { font-weight: 700; font-family: monospace; font-size: 0.8rem; }
  .key-size { color: #b0ada8; font-size: 0.75rem; }
  .btn-reset {
    background: #e05252;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 13px 28px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    width: 100%;
    margin-bottom: 10px;
    transition: background 0.15s;
  }
  .btn-reset:hover { background: #c84040; }
  .btn-back {
    background: transparent;
    color: #7a7570;
    border: 1.5px solid #e8e6e0;
    border-radius: 10px;
    padding: 10px 28px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    text-decoration: none;
    display: block;
    transition: background 0.15s;
  }
  .btn-back:hover { background: #f5f4f0; }
  .success-msg {
    display: none;
    background: #edf7ed;
    color: #3aaa60;
    border-radius: 10px;
    padding: 12px;
    font-weight: 700;
    font-size: 0.88rem;
    margin-bottom: 12px;
  }
  .dev-badge {
    display: inline-block;
    background: #fef4e5;
    color: #f0a030;
    border-radius: 99px;
    padding: 3px 10px;
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🗑️</div>
  <div class="dev-badge">Dev Utility</div>
  <div class="title">Reset All Data</div>
  <p class="subtitle">
    Clears all localStorage data for the Homeschool Tracker —
    students, courses, week checks, overrides, and archive.
    This cannot be undone.
  </p>

  <div class="keys-list">
    <p>Storage keys</p>
    <div id="keys-preview"><!-- built by JS --></div>
  </div>

  <div class="success-msg" id="success-msg">✓ All data cleared. Ready for a fresh start.</div>

  <button class="btn-reset" id="btn-reset">Reset Everything</button>
  <a href="index.html" class="btn-back">‹ Back to Tracker</a>
</div>

<script>
const KEYS = [
  'hs_students',
  'hs_overrides',
  'hs_removals',
  'hs_hidden',
  'hs_weeks',
  'hs_archive',
];

function formatBytes(n) {
  if (n === 0) return '—';
  if (n < 1024) return n + ' B';
  return (n / 1024).toFixed(1) + ' KB';
}

function renderPreview() {
  const container = document.getElementById('keys-preview');
  container.innerHTML = '';
  KEYS.forEach(key => {
    const val = localStorage.getItem(key);
    const size = val ? new Blob([val]).size : 0;
    const row = document.createElement('div');
    row.className = 'key-row';
    row.innerHTML = `
      <span class="key-name">${key}</span>
      <span class="key-size">${size > 0 ? formatBytes(size) : 'empty'}</span>
    `;
    container.appendChild(row);
  });
}

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Are you sure? This will permanently delete all tracker data.')) return;
  KEYS.forEach(k => localStorage.removeItem(k));
  renderPreview();
  document.getElementById('success-msg').style.display = 'block';
  document.getElementById('btn-reset').disabled = true;
  document.getElementById('btn-reset').style.opacity = '0.4';
});

renderPreview();
</script>

</body>
</html>
