<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Homeschool Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="archive.css">
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <a href="index.html" class="btn btn-ghost btn-back">‹ Tracker</a>
      <div class="app-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="var(--accent)"/>
          <path d="M7 10h14M7 14h10M7 18h12" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1 class="app-title">Archive</h1>
        <p class="app-subtitle" id="archive-subtitle">Loading…</p>
      </div>
    </div>
    <div class="header-right">
      <div class="archive-filter-bar">
        <input class="input-inline archive-search" id="archive-search" placeholder="Search weeks or students…">
        <button class="btn btn-ghost" id="btn-export">⬇ Export JSON</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="archive-main">

    <!-- SIDEBAR: week list -->
    <aside class="archive-sidebar" id="archive-sidebar">
      <div class="sidebar-section-label">Weeks</div>
      <div id="week-list"><!-- built by JS --></div>
    </aside>

    <!-- DETAIL: selected week -->
    <section class="archive-detail" id="archive-detail">
      <div class="archive-detail-empty" id="detail-empty">
        <div class="archive-empty-icon">📋</div>
        <p>Select a week from the list to view its details.</p>
      </div>
      <div id="detail-content" class="hidden"></div>
    </section>

  </main>

</div>

<script src="export.js"></script>
<script src="archive.js"></script>
</body>
</html>
